
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Roulette</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #17172e, #29295b);
      min-height: 100vh;
      text-align: center;
    }

    nav {
      padding: 20px;
      background: #111124;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      font-size: clamp(32px, 7vw, 52px);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #c5c5e8;
      margin-bottom: 30px;
    }

    .pokemon-card {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 25px;
      margin: 25px auto;
      max-width: 400px;
      min-height: 320px;
    }

    .pokemon-card img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    #pokemonName {
      font-size: 28px;
      text-transform: capitalize;
      margin: 10px 0;
    }

    #pokemonNumber {
      color: #b9b9df;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: #17172e;
      background: #ffcb05;
      box-shadow: 0 5px 0 #c69c00;
      transition: transform 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      margin-top: 22px;
      color: #d5d5ff;
    }

    footer {
      padding: 25px;
      color: #aaaacc;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">← Mijn website</a>
    <span>⚡ Pokémon Roulette</span>
  </nav>

  <main class="container">
    <h1>Pokémon Roulette</h1>
    <p class="subtitle">
      Draai de roulette en ontdek welke Pokémon je krijgt!
    </p>

    <section class="pokemon-card">
      <img
        id="pokemonImage"
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png"
        alt="Pokémon"
      >

      <h2 id="pokemonName">Pikachu</h2>
      <p id="pokemonNumber">Druk op de knop om te beginnen</p>
    </section>

    <button id="spinButton" onclick="spinRoulette()">
      🎲 DRAAI DE ROULETTE
    </button>

    <p id="status" aria-live="polite">Wie wordt jouw Pokémon?</p>
  </main>

  <footer>
    Pokémon Roulette — gemaakt voor Pokémon-fans.
    Pokémon is een handelsmerk van zijn respectieve eigenaars.
  </footer>

  <script>
    const image = document.getElementById("pokemonImage");
    const name = document.getElementById("pokemonName");
    const number = document.getElementById("pokemonNumber");
    const button = document.getElementById("spinButton");
    const status = document.getElementById("status");

    let spinning = false;

    function getPokemonImage(id) {
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
    }

    function spinRoulette() {
      if (spinning) return;

      spinning = true;
      button.disabled = true;
      status.textContent = "🎰 De roulette draait...";

      let ticks = 0;
      const duration = 25;

      const animation = setInterval(() => {
        const randomId = Math.floor(Math.random() * 1025) + 1;

        image.src = getPokemonImage(randomId);
        name.textContent = "???";
        number.textContent = "Pokémon #" + randomId;

        ticks++;

        if (ticks >= duration) {
          clearInterval(animation);
          revealPokemon();
        }
      }, 100);
    }

    async function revealPokemon() {
      const id = Math.floor(Math.random() * 1025) + 1;

      image.src = getPokemonImage(id);
      name.textContent = "Pokémon #" + id;
      number.textContent = "Nummer " + id;
      status.textContent = "Pokémon gevonden!";

      try {
        const response = await fetch(
          `https://pokeapi.co/api/v2/pokemon/${id}`
        );

        if (!response.ok) throw new Error("Pokémon niet gevonden");

        const pokemon = await response.json();

        name.textContent = pokemon.name.replace(/-/g, " ");
        number.textContent = "Pokédex #" + pokemon.id;
        image.src =
          pokemon.sprites.other?.["official-artwork"]?.front_default
          || pokemon.sprites.front_default
          || getPokemonImage(id);

        status.textContent = "✨ Dit is jouw Pokémon!";
      } catch (error) {
        status.textContent =
          "Pokémon geselecteerd! De extra informatie is niet beschikbaar.";
      } finally {
        spinning = false;
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
