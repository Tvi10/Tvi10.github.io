```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dobbelsteen Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding-top: 80px;
    }

    .game {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px #bbb;
    }

    #dice {
      font-size: 80px;
      margin: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    #result {
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🎲 Dobbelsteen</h1>
    <p>Gooi de dobbelsteen!</p>

    <div id="dice">⚀</div>

    <button onclick="rollDice()">Gooien</button>

    <p id="result"></p>
  </div>

  <script>
    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDice() {
      const number = Math.floor(Math.random() * 6) + 1;

      document.getElementById("dice").textContent = diceFaces[number - 1];

      if (number === 6) {
        document.getElementById("result").textContent =
          "🎉 Je gooide een 6!";
      } else {
        document.getElementById("result").textContent =
          "Je gooide " + number + ".";
      }
    }
  </script>

</body>
</html>
```
