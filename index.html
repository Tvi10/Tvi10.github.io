<html>
<head>
<style>
body{
  margin:0;
  color:white;
  font-family:Arial;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 30%,#6b00ff55,transparent 25%),
    radial-gradient(circle at 80% 70%,#00aaff44,transparent 25%),
    linear-gradient(135deg,#02000b,#10002b,#000);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(white 1px,transparent 1px);
  background-size:50px 50px;
  opacity:.6;
}

nav{
  position:relative;
  background:#050014cc;
  padding:15px;
  text-align:center;
}

select{
  padding:10px;
  background:#160044;
  color:white;
  border:1px solid #8844ff;
}

.info{
  position:relative;
  padding:30px;
}

.fotos{
  position:absolute;
  right:20px;
  bottom:20px;
  display:grid;
  grid-template-columns:100px 100px;
  gap:10px;
}

.fotos img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:10px;
}
</style>
</head>
<body>

<nav>
  <select>
    <option>Menu</option>
    <option>Over mij</option>
    <option>Mijn hobby's</option>
    <option>Contact</option>
  </select>
</nav>

<div class="info">
  <h1>Over mij</h1>
  <p>Hoi, mijn naam is Timo. Ik ben 15 jaar.</p>
  <p>Mijn hobby's zijn gamen en slapen.</p>
</div>

<div class="fotos">
  <img src="plaatje1.jpg">
  <img src="plaatje2.jpg">
  <img src="plaatje3.jpg">
  <img src="plaatje4.jpg">
</div>

</body>
</html>
